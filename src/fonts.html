<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Your fonts · Firefonts</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="page">
  <main>
    <header class="head">
      <h1>Your fonts</h1>
      <button type="button" id="add" class="icon-button" aria-label="Add font files" title="Add font files">
        <svg viewBox="0 -960 960 960" aria-hidden="true"><path d="M440-440H200v-80h240v-240h80v240h240v80H520v240h-80v-240Z"/></svg>
      </button>
      <input type="file" id="files" accept=".ttf,.otf,.woff,.woff2" multiple hidden>
    </header>
    <p id="note" role="status"></p>
    <p id="choose">Choose your font:</p>
    <ul id="list" aria-labelledby="choose"></ul>
  </main>
  <script src="lib.js"></script>
  <script src="fonts.js"></script>
</body>
</html>
