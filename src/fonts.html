<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Settings · Firefonts</title>
  <link rel="icon" href="icon-64.png" type="image/png" sizes="64x64">
  <link rel="icon" href="icon.svg" type="image/svg+xml" sizes="any">
  <script src="theme.js"></script>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body class="page">
  <main>
    <h1 class="title">Settings</h1>
    <header class="head">
      <h2>Fonts</h2>
      <button type="button" id="add" class="icon-button" aria-label="Add font files" title="Add font files">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="6" fill="currentColor" fill-opacity="0.12"/><path d="M12 8.5V15.5M8.5 12H15.5"/></svg>
      </button>
      <input type="file" id="files" accept=".ttf,.otf,.woff,.woff2" multiple hidden>
    </header>
    <p id="spoken" role="status"></p>
    <p id="note" role="status"></p>
    <p id="choose">Choose your font:</p>
    <button type="button" id="chooser" class="field" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="fontlist" aria-labelledby="choose">
      <span></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 10L12 14.5L16.5 10"/></svg>
    </button>
    <label class="row">
      <span>Apply this font to all websites</span>
      <input type="checkbox" switch role="switch" id="all" checked>
    </label>
    <hr class="divider">
    <h2 id="preview-title">Preview</h2>
    <p id="preview-hint" class="hint">Type your own sentence to test the font.</p>
    <textarea id="sample" class="field" rows="1" aria-labelledby="preview-title" aria-describedby="preview-hint" placeholder="The quick brown fox jumps over the lazy dog." spellcheck="false">The quick brown fox jumps over the lazy dog.</textarea>
    <hr class="divider">
    <h2 id="sites-title">Websites</h2>
    <p id="sites-hint" class="hint">Add websites to change their fonts.</p>
    <ul id="sites" class="rows" aria-labelledby="sites-title"></ul>
    <div class="field-box">
      <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="currentColor" fill-opacity="0.12"/><path d="M12 3.5C9.5 6 8.5 9 8.5 12S9.5 18 12 20.5C14.5 18 15.5 15 15.5 12S14.5 6 12 3.5Z"/><path d="M4.5 9H19.5M4.5 15H19.5"/></svg>
      <input type="text" id="site" class="field" aria-label="Website to add" aria-describedby="sites-hint" placeholder="example.com" spellcheck="false" autocomplete="off">
      <button type="button" id="add-site" class="field-action" aria-label="Add website" title="Add website">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5.5 12.5L10 17L18.5 7.5"/></svg>
      </button>
      <p id="site-problem" class="problem"></p>
    </div>
    <template id="site-row">
      <li class="site">
        <button type="button" class="handle">
          <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="6" r="1.25"/><circle cx="15" cy="6" r="1.25"/><circle cx="9" cy="12" r="1.25"/><circle cx="15" cy="12" r="1.25"/><circle cx="9" cy="18" r="1.25"/><circle cx="15" cy="18" r="1.25"/></svg>
        </button>
        <div class="field-box">
        <img class="field-icon" alt="" hidden>
        <svg class="field-icon globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="currentColor" fill-opacity="0.12"/><path d="M12 3.5C9.5 6 8.5 9 8.5 12S9.5 18 12 20.5C14.5 18 15.5 15 15.5 12S14.5 6 12 3.5Z"/><path d="M4.5 9H19.5M4.5 15H19.5"/></svg>
        <input type="text" class="field" spellcheck="false" autocomplete="off">
        <button type="button" class="field-action">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7L17 17M17 7L7 17"/></svg>
        </button>
        <p class="problem"></p>
        </div>
        <button type="button" class="allow button" hidden>Allow</button>
        <button type="button" class="font-pick" role="combobox" aria-haspopup="listbox" aria-expanded="false" aria-controls="fontlist">
          <span></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7.5 10L12 14.5L16.5 10"/></svg>
        </button>
      </li>
    </template>
    <ul id="fontlist" class="fonts" role="listbox" tabindex="-1" hidden></ul>
  </main>
  <footer class="foot">
    <a class="icon-button" href="https://github.com/toshiotomikawa/firefonts" target="_blank" rel="noopener" aria-label="Firefonts on GitHub" title="Firefonts on GitHub">
      <svg viewBox="0 -0.5 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 0c6.63 0 12 5.276 12 11.79-.001 5.067-3.29 9.567-8.175 11.187-.6.118-.825-.25-.825-.56 0-.398.015-1.665.015-3.242 0-1.105-.375-1.813-.81-2.181 2.67-.295 5.475-1.297 5.475-5.822 0-1.297-.465-2.344-1.23-3.169.12-.295.54-1.503-.12-3.125 0 0-1.005-.324-3.3 1.209a11.32 11.32 0 00-3-.398c-1.02 0-2.04.133-3 .398-2.295-1.518-3.3-1.209-3.3-1.209-.66 1.622-.24 2.83-.12 3.125-.765.825-1.23 1.887-1.23 3.169 0 4.51 2.79 5.527 5.46 5.822-.345.294-.66.81-.765 1.577-.69.31-2.415.81-3.495-.973-.225-.354-.9-1.223-1.845-1.209-1.005.015-.405.56.015.781.51.28 1.095 1.327 1.23 1.666.24.663 1.02 1.93 4.035 1.385 0 .988.015 1.916.015 2.196 0 .31-.225.664-.825.56C3.303 21.374-.003 16.867 0 11.791 0 5.276 5.37 0 12 0z"/></svg>
    </a>
    <button type="button" id="theme" class="icon-button">
      <svg data-theme="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="3" fill="currentColor" fill-opacity="0.12"/><path d="M9 20H15M12 16.5V20"/></svg>
      <svg data-theme="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor" fill-opacity="0.12"/><path d="M12 3V5M12 19V21M3 12H5M19 12H21M5.6 5.6L7 7M17 17L18.4 18.4M18.4 5.6L17 7M7 17L5.6 18.4"/></svg>
      <svg data-theme="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 1 1 9.5 4.5A6.5 6.5 0 0 0 19.5 14.5Z" fill="currentColor" fill-opacity="0.12"/></svg>
    </button>
  </footer>
  <script src="lib.js"></script>
  <script src="fonts.js"></script>
  <script src="depth.js"></script>
</body>
</html>
