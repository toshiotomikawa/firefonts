<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Firefonts</title>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1 class="brand"><img src="icon.svg" alt="">Firefonts</h1>
  <main id="app">
    <label class="row">
      <span>Enable Firefonts on this website <span id="host">this site</span></span>
      <input type="checkbox" switch role="switch" id="on" disabled>
    </label>
    <input type="text" id="font" aria-label="Font name" aria-describedby="note" placeholder="Font name, like Arial" spellcheck="false" autocomplete="off" list="bundled">
    <datalist id="bundled"></datalist>
    <p id="note" role="status"></p>
    <p id="scope" class="hint" hidden>Used on all your websites.</p>
    <nav class="tools" aria-label="Firefonts">
      <button type="button" id="manage" class="icon-button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.31 5.21L10.71 2.84L13.29 2.84L13.69 5.21L15.61 6L17.57 4.61L19.39 6.43L18 8.39L18.79 10.31L21.16 10.71L21.16 13.29L18.79 13.69L18 15.61L19.39 17.57L17.57 19.39L15.61 18L13.69 18.79L13.29 21.16L10.71 21.16L10.31 18.79L8.39 18L6.43 19.39L4.61 17.57L6 15.61L5.21 13.69L2.84 13.29L2.84 10.71L5.21 10.31L6 8.39L4.61 6.43L6.43 4.61L8.39 6ZM15 12A3 3 0 1 0 9 12A3 3 0 1 0 15 12Z" fill="currentColor" fill-opacity="0.12" fill-rule="evenodd"/></svg>
      </button>
    <a class="icon-button" href="https://github.com/toshiotomikawa/firefonts" target="_blank" rel="noopener" aria-label="Firefonts on GitHub" title="Firefonts on GitHub">
      <svg viewBox="0 -0.5 24 24" aria-hidden="true"><path fill-rule="evenodd" d="M12 0c6.63 0 12 5.276 12 11.79-.001 5.067-3.29 9.567-8.175 11.187-.6.118-.825-.25-.825-.56 0-.398.015-1.665.015-3.242 0-1.105-.375-1.813-.81-2.181 2.67-.295 5.475-1.297 5.475-5.822 0-1.297-.465-2.344-1.23-3.169.12-.295.54-1.503-.12-3.125 0 0-1.005-.324-3.3 1.209a11.32 11.32 0 00-3-.398c-1.02 0-2.04.133-3 .398-2.295-1.518-3.3-1.209-3.3-1.209-.66 1.622-.24 2.83-.12 3.125-.765.825-1.23 1.887-1.23 3.169 0 4.51 2.79 5.527 5.46 5.822-.345.294-.66.81-.765 1.577-.69.31-2.415.81-3.495-.973-.225-.354-.9-1.223-1.845-1.209-1.005.015-.405.56.015.781.51.28 1.095 1.327 1.23 1.666.24.663 1.02 1.93 4.035 1.385 0 .988.015 1.916.015 2.196 0 .31-.225.664-.825.56C3.303 21.374-.003 16.867 0 11.791 0 5.276 5.37 0 12 0z"/></svg>
    </a>
    <button type="button" id="theme" class="icon-button">
      <svg data-theme="system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="12" rx="3" fill="currentColor" fill-opacity="0.12"/><path d="M9 20H15M12 16.5V20"/></svg>
      <svg data-theme="light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor" fill-opacity="0.12"/><path d="M12 3V5M12 19V21M3 12H5M19 12H21M5.6 5.6L7 7M17 17L18.4 18.4M18.4 5.6L17 7M7 17L5.6 18.4"/></svg>
      <svg data-theme="dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19.5 14.5A8 8 0 1 1 9.5 4.5A6.5 6.5 0 0 0 19.5 14.5Z" fill="currentColor" fill-opacity="0.12"/></svg>
    </button>
    </nav>
  </main>
  <p id="blocked" hidden>Firefox doesn't let extensions change this page.</p>
  <script src="lib.js"></script>
  <script src="popup.js"></script>
</body>
</html>
